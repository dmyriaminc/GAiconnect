<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error | GAi Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background: #0e0e0f; color: #ffffff; }
    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 197, 99, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 197, 99, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }
    .glitch { animation: glitch 0.3s infinite; }
  </style>
</head>
<body class="cyber-grid min-h-screen flex items-center justify-center">
  <div class="text-center max-w-md mx-auto px-6">
    <div class="text-8xl font-black text-amber-400 mb-4 glitch">404</div>
    <h1 class="text-2xl font-bold mb-2">System Error Detected</h1>
    <p class="text-zinc-400 mb-6">
      The page you're looking for doesn't exist or has been moved.
      GAi is working to resolve this issue.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="px-6 py-3 bg-amber-400 text-black font-bold rounded-lg hover:bg-amber-300 transition-colors">
        Return Home
      </a>
      <a href="dashboard.html" class="px-6 py-3 border border-amber-400/30 text-amber-400 rounded-lg hover:bg-amber-400/10 transition-colors">
        Go to Dashboard
      </a>
    </div>
    <p class="text-zinc-600 text-xs mt-12">
      Error logged. GAi Connect v1.0
    </p>
  </div>
</body>
</html>
