<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Members | GAi Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="supabase-client.js"></script>
  <script src="gai-user.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Manrope', sans-serif; }
    .font-headline { font-family: 'Space Grotesk', sans-serif; }
    .material-symbols-outlined { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; }
    .glass-panel { background: rgba(26, 25, 27, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-neutral-950 min-h-screen">
  
  <header class="bg-black/80 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-white/10 h-16 flex items-center">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between w-full">
      <a href="dashboard.html" class="flex items-center gap-2">
        <span class="font-headline text-2xl font-black tracking-tighter text-amber-400">GAi Connect</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="dashboard.html" class="text-zinc-400 hover:text-amber-400 transition-colors">
          <span class="material-symbols-outlined filled">arrow_back</span>
        </a>
      </div>
    </div>
  </header>
  
  <main class="pt-24 pb-12 px-6">
    <div class="max-w-6xl mx-auto">
      <div class="mb-8">
        <h1 class="font-headline text-3xl font-bold text-white mb-2">Online Members</h1>
        <p class="text-zinc-400">Connect with verified professionals on GAi Connect</p>
      </div>
      
      <!-- Filters -->
      <div class="flex flex-wrap gap-4 mb-8">
        <input type="text" id="search-members" placeholder="Search by name, skill, or location..." class="flex-1 min-w-[200px] bg-neutral-900 border border-zinc-700 text-white px-4 py-3 rounded-sm focus:border-amber-400 outline-none">
        <select id="filter-tier" class="bg-neutral-900 border border-zinc-700 text-white px-4 py-3 rounded-sm focus:border-amber-400 outline-none">
          <option value="">All Tiers</option>
          <option value="Free">Free</option>
          <option value="Standard">Standard</option>
          <option value="Premium">Premium</option>
          <option value="Elite">Elite</option>
          <option value="VVIP">VVIP</option>
        </select>
        <select id="filter-status" class="bg-neutral-900 border border-zinc-700 text-white px-4 py-3 rounded-sm focus:border-amber-400 outline-none">
          <option value="">All Status</option>
          <option value="online">Online</option>
          <option value="offline">Offline</option>
        </select>
      </div>
      
      <!-- Members Grid -->
      <div id="members-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Members will be loaded here -->
      </div>
      
      <div id="no-members" class="hidden text-center py-12">
        <span class="material-symbols-outlined text-6xl text-zinc-600 mb-4">person_search</span>
        <p class="text-zinc-500">No members found matching your criteria.</p>
      </div>
    </div>
  </main>
  
  <script>
    const defaultMembers = [
      { id: 'GAi001001', nickname: 'Xenon_77', fullname: 'System Operator', tier: 'VVIP', status: 'online', role: 'Trading Nodes', location: 'New York, USA', initials: 'XL', color: 'amber' },
      { id: 'GAi001002', nickname: 'Nova_Protocol', fullname: 'Alex Nova', tier: 'Elite', status: 'online', role: 'Data Architect', location: 'London, UK', initials: 'NP', color: 'blue' },
      { id: 'GAi001003', nickname: 'The_Oracle', fullname: 'Sarah Oracle', tier: 'Premium', status: 'online', role: 'Storage Pro', location: 'Tokyo, Japan', initials: 'OR', color: 'purple' },
      { id: 'GAi001004', nickname: 'NeonViper', fullname: 'Mike Viper', tier: 'Standard', status: 'online', role: 'AI Specialist', location: 'Berlin, Germany', initials: 'NV', color: 'pink' },
      { id: 'GAi001005', nickname: 'QuantumRush', fullname: 'Emma Rush', tier: 'Premium', status: 'online', role: 'Security Expert', location: 'Sydney, Australia', initials: 'QR', color: 'cyan' },
      { id: 'GAi001006', nickname: 'CyberForge', fullname: 'John Forge', tier: 'Standard', status: 'offline', role: 'Developer', location: 'Toronto, Canada', initials: 'CF', color: 'zinc' },
      { id: 'GAi001007', nickname: 'TechDuke', fullname: 'Duke Tech', tier: 'Free', status: 'offline', role: 'Analyst', location: 'Paris, France', initials: 'TD', color: 'zinc' },
      { id: 'GAi001008', nickname: 'DataStorm', fullname: 'Storm Data', tier: 'Elite', status: 'online', role: 'Neural Network', location: 'Singapore', initials: 'DS', color: 'green' },
      { id: 'GAi001009', nickname: 'PixelWolf', fullname: 'Wolf Pixel', tier: 'Premium', status: 'online', role: 'Creative Director', location: 'Seoul, Korea', initials: 'PW', color: 'orange' },
      { id: 'GAi001010', nickname: 'CryptoNova', fullname: 'Nova Crypto', tier: 'Standard', status: 'offline', role: 'Blockchain Dev', location: 'Dubai, UAE', initials: 'CN', color: 'zinc' },
      { id: 'GAi001011', nickname: 'SynthWave', fullname: 'Wave Synth', tier: 'VVIP', status: 'online', role: 'Quantum Engineer', location: 'Amsterdam, NL', initials: 'SW', color: 'amber' },
      { id: 'GAi001012', nickname: 'BinaryStar', fullname: 'Star Binary', tier: 'Elite', status: 'online', role: 'Systems Architect', location: 'Austin, USA', initials: 'BS', color: 'blue' }
    ];
    
    const tierColors = {
      'Free': { bg: 'bg-zinc-500/20', text: 'text-zinc-400', border: 'border-zinc-500/30' },
      'Standard': { bg: 'bg-blue-500/20', text: 'text-blue-400', border: 'border-blue-500/30' },
      'Premium': { bg: 'bg-amber-500/20', text: 'text-amber-400', border: 'border-amber-500/30' },
      'Elite': { bg: 'bg-purple-500/20', text: 'text-purple-400', border: 'border-purple-500/30' },
      'VVIP': { bg: 'bg-pink-500/20', text: 'text-pink-400', border: 'border-pink-500/30' }
    };
    
    async function loadMembers() {
      // Try to fetch from Supabase first
      let users = JSON.parse(localStorage.getItem('gai_users') || '[]');
      
      if (typeof supabase !== 'undefined' && supabase.isConfigured) {
        try {
          const { data, error } = await supabase.from('users').select('*');
          if (!error && data && data.length > 0) {
            users = data;
            // Update localStorage cache
            localStorage.setItem('gai_users', JSON.stringify(users));
          }
        } catch (e) {
          console.warn('Failed to fetch users from Supabase:', e.message);
        }
      }
      
      const registeredUsers = users.map(u => ({
        id: u.id || u.user_id,
        nickname: u.nickname || u.fullname || 'User',
        fullname: u.fullname || u.nickname || 'User',
        tier: u.tier || 'Standard',
        status: 'online', // All registered users are considered online
        role: u.nationality || 'Member',
        location: u.location || u.reg_location || 'Unknown',
        initials: (u.nickname || u.fullname || 'U').substring(0, 2).toUpperCase(),
        color: 'amber'
      }));
      
      // Get current logged-in user
      const currentUserId = localStorage.getItem('gai_userId');
      
      // Filter out current user and combine with defaults
      const filteredDefaults = defaultMembers.filter(dm => dm.id !== currentUserId && !registeredUsers.find(r => r.id === dm.id));
      const allMembers = [...registeredUsers, ...filteredDefaults];
      
      console.log('Total members loaded:', allMembers.length, 'Registered:', registeredUsers.length);
      return allMembers;
    }
    
    function renderMembers(members) {
      const grid = document.getElementById('members-grid');
      const noMembers = document.getElementById('no-members');
      
      if (members.length === 0) {
        grid.classList.add('hidden');
        noMembers.classList.remove('hidden');
        return;
      }
      
      grid.classList.remove('hidden');
      noMembers.classList.add('hidden');
      
      grid.innerHTML = members.map(member => {
        const colors = tierColors[member.tier] || tierColors['Standard'];
        const isOnline = member.status === 'online';
        const color = member.color || 'amber';
        
        return `
          <div class="glass-panel rounded-lg p-6 hover:border-amber-400/30 transition-all cursor-pointer" onclick="viewMember('${member.id}')">
            <div class="flex flex-col items-center text-center">
              <div class="relative mb-4">
                <div class="w-20 h-20 rounded-full bg-gradient-to-br from-${color}-400/30 to-neutral-800 border-2 border-${color}-400/50 flex items-center justify-center text-xl font-bold text-${color}-400">
                  ${member.initials}
                </div>
                <span class="absolute -bottom-1 -right-1 w-5 h-5 ${isOnline ? 'bg-green-500' : 'bg-zinc-500'} rounded-full border-4 border-neutral-950"></span>
              </div>
              <h3 class="font-headline font-bold text-white mb-1">${member.nickname}</h3>
              <p class="text-xs text-zinc-500 mb-3">${member.fullname}</p>
              <span class="px-3 py-1 ${colors.bg} ${colors.text} text-xs font-bold uppercase rounded-sm mb-3">${member.tier}</span>
              <p class="text-xs text-zinc-500 mb-1">${member.role}</p>
              <p class="text-[10px] text-zinc-600">${member.location}</p>
              <div class="mt-4 pt-4 border-t border-white/10 w-full">
                <button onclick="event.stopPropagation(); connectWithMember('${member.id}')" class="w-full py-2 bg-amber-400 text-black text-sm font-bold rounded-sm hover:bg-amber-300 transition-colors">
                  ${isOnline ? 'Connect' : 'Send Message'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    async function filterMembers() {
      const search = document.getElementById('search-members').value.toLowerCase();
      const tierFilter = document.getElementById('filter-tier').value;
      const statusFilter = document.getElementById('filter-status').value;
      
      const members = await loadMembers();
      const filtered = members.filter(m => {
        const matchesSearch = !search || 
          m.nickname.toLowerCase().includes(search) ||
          m.fullname.toLowerCase().includes(search) ||
          m.role.toLowerCase().includes(search) ||
          m.location.toLowerCase().includes(search);
        const matchesTier = !tierFilter || m.tier === tierFilter;
        const matchesStatus = !statusFilter || m.status === statusFilter;
        return matchesSearch && matchesTier && matchesStatus;
      });
      
      renderMembers(filtered);
    }
    
    function viewMember(id) {
      window.location.href = 'profile.html?id=' + id;
    }
    
    function connectWithMember(id) {
      localStorage.setItem('connection_request_' + id, 'true');
      alert('Connection request sent!\n\nWaiting for acceptance...');
    }
    
    document.getElementById('search-members').addEventListener('input', filterMembers);
    document.getElementById('filter-tier').addEventListener('change', filterMembers);
    document.getElementById('filter-status').addEventListener('change', filterMembers);
    
    document.addEventListener('DOMContentLoaded', async function() {
      const members = await loadMembers();
      renderMembers(members);
    });
  </script>
</body>
</html>
